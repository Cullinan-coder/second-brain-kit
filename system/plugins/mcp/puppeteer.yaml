# Eklenti tanımı (manifest) — sb/plugins.py doğrular.
id: puppeteer
type: mcp
name:
  tr: Puppeteer
  en: Puppeteer
desc:
  tr: 'Tarayıcıyı komutla gezdirir, ekran görüntüsü alır. NOT: paket arşivlendi; yenisi için Playwright.'
  en: 'Drives a browser, takes screenshots. NOTE: package is archived; prefer Playwright.'
category: setup
catalog_ids: []
requires:
  accounts: []
  fields: []
  secrets: []
  hardware: {}
