[project]
name = "second-brain"
version = "0.1.0"
description = "Kişisel ikinci beyin: Obsidian kasası + veri toplama + yerel asistan araçları"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "keyring>=25.7.0",
    "mcp<2",
    "mss>=10.2.0",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "psutil>=7.2.2",
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0",
    "tzdata>=2026.6",
    "pyobjc-framework-vision>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=11.0; sys_platform == 'darwin'",
    "winrt-runtime>=4.0.3; sys_platform == 'win32'",
    "winrt-windows-foundation>=4!10.0.28000.2705; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=4!10.0.28000.2705; sys_platform == 'win32'",
    "winrt-windows-globalization>=4!10.0.28000.2705; sys_platform == 'win32'",
    "winrt-windows-graphics-imaging>=4!10.0.28000.2705; sys_platform == 'win32'",
    "winrt-windows-media-ocr>=4!10.0.28000.2705; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=4!10.0.28000.2705; sys_platform == 'win32'",
    "youtube-transcript-api>=1.2",
]

[tool.uv]
package = false
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
