# Eklenti tanımı (manifest) — sb/plugins.py doğrular.
id: github
type: module
name:
  tr: GitHub derin
  en: GitHub deep
desc:
  tr: Issue, PR, commit ve release kayıtları
  en: Issues, PRs, commits and releases.
category: school_project
module: github
catalog_ids:
- 98
- 99
