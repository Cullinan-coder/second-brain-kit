# Eklenti tanımı (manifest) — sb/plugins.py doğrular.
id: postgres
type: mcp
name:
  tr: PostgreSQL
  en: PostgreSQL
desc:
  tr: 'PostgreSQL veritabanını salt okunur sorgular. NOT: paket arşivlendi.'
  en: 'Queries a PostgreSQL database read-only. NOTE: package is archived.'
category: setup
catalog_ids: []
requires:
  accounts: []
  fields:
  - key: postgres_url
    label:
      tr: Bağlantı adresi (postgresql://…)
      en: Connection URL (postgresql://…)
    kind: secret
    secret: true
    required: true
    help:
      tr: Parola içerir; yalnız şifre kasasında tutulur.
      en: Contains a password; stored only in the keychain.
  secrets:
  - postgres_url
  hardware: {}
  apps:
  - Node.js
mcp:
  command: npx
  args:
  - -y
  - '@modelcontextprotocol/server-postgres'
  - '{postgres_url}'
  env: {}
  install: npm view @modelcontextprotocol/server-postgres version
  docs_url: https://github.com/modelcontextprotocol/servers-archived/tree/main/src/postgres
  remote: false
health:
  cli: sb doctor
default_on: false
presets:
- meslek:yazilimci
