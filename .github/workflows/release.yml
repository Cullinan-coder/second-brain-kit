# v* etiketi atılınca Windows ve macOS'ta Second Brain Setup + Second Brain uygulamasını PyInstaller ile derler, GitHub Release'e ekler.
# Kit deposunda .github/workflows/release.yml olarak durur (tools/build_kit.py kopyalar). Etiket: git tag v1.0.0 && git push origin v1.0.0
# Release dosyaları: Second-Brain-Setup.exe (Windows), Second-Brain-Setup-macOS.zip (içinde Second Brain Setup.app).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:                       # elle çalıştırma yalnız derler (yayınlamaz)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Derleme araçları
        shell: bash
        run: python -m pip install --upgrade pip pyinstaller pyyaml pywebview keyring send2trash pillow
      - name: Second Brain ve Second Brain Setup derle
        shell: bash
        run: python packaging/build.py --kit .
      - uses: actions/upload-artifact@v4
        with:
          name: second-brain-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error
      - name: GitHub Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
