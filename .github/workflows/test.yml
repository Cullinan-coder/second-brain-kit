# Güvenlik (D-13): `uses:` tam commit SHA'sına sabit; `uv run --frozen` kilit dosyasındaki sürümlerle çalışır (kilit güncellenmez).
# Sıfırdan kurulum + testler (kişisel hesap/anahtar gerektirmez).
# Her push'ta yalnız Windows; macOS (gizli depoda dakikası 10 kat sayılır) yalnız sürüm etiketinde (v*) ve elle çalıştırmada.
name: test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  install-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && fromJSON('["windows-latest","macos-latest"]') || fromJSON('["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: git kimliği (kasa deposu için)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: Kurulum (sorusuz)
        shell: bash
        run: |
          VAULT="$RUNNER_TEMP/vault"
          python3 - "$VAULT" <<'EOF'
          import json, sys
          json.dump({"name": "Deneme", "full_name": "Deneme Kişi", "bio": "ci", "timezone": "Europe/Istanbul",
                     "github_user": "", "workspace": "~/Projects", "vault": sys.argv[1], "gmail": "deneme@example.com",
                     "client_secret": "", "google_login": False, "claude": False, "ollama_pull": False, "ollama_vl": False,
                     "schedule": False, "git": True, "claude_md": False}, open("ans.json", "w", encoding="utf-8"), ensure_ascii=False)
          EOF
          uv run --no-project --python 3.12 --with pyyaml install.py --answers ans.json
      - name: Testler
        shell: bash
        run: |
          cd "$RUNNER_TEMP/vault/_system"
          uv run --frozen python -X utf8 -m pytest -q
      - name: Komut satırı
        shell: bash
        run: |
          cd "$RUNNER_TEMP/vault/_system"
          uv run --frozen python -X utf8 -m sb version
          uv run --frozen python -X utf8 -m sb capture "deneme notu: CI'dan beyne at"
          uv run --frozen python -X utf8 -m sb arsenal
          ls "$RUNNER_TEMP/vault/00-Inbox/Dump"
