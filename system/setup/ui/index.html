<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Brain Kurulum</title>
<link rel="stylesheet" href="setup.css">
</head>
<body>
<header class="top">
  <h1 data-i18n="app.title">Second Brain Kurulum</h1>
  <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar">
    <div class="fill" id="fill"></div><span id="pct">0%</span>
  </div>
  <div class="tools">
    <button id="btn-lang" class="ghost" type="button" data-i18n-title="lang.switch">TR/EN</button>
    <button id="btn-theme" class="ghost" type="button" data-i18n-title="theme.switch">◐</button>
  </div>
</header>
<div id="banner" class="banner" hidden></div>

<div id="app-wizard" class="wizard" hidden>
  <aside class="side" aria-label="Adımlar">
    <ol id="stepnav" class="stepnav"></ol>
  </aside>
  <div class="stage">
    <main id="step-body" class="stepbody"></main>
    <footer class="bar">
      <button id="nav-back" class="ghost" type="button" data-i18n="wiz.prev">Geri</button>
      <span id="stepcount" class="muted grow"></span>
      <button id="nav-skip" class="ghost" type="button" data-i18n="wiz.skip">Atla</button>
      <button id="nav-next" class="primary" type="button" data-i18n="wiz.next">İleri</button>
    </footer>
  </div>
</div>

<div id="app-settings" class="settings" hidden>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="tab-body"></main>
</div>

<div id="tour" class="modal" hidden role="dialog" aria-modal="true">
  <div class="dialog"><h2 id="tour-title"></h2><p id="tour-text"></p>
    <div class="row"><span id="tour-n" class="muted"></span>
    <button id="tour-close" class="ghost" type="button" data-i18n="tour.close">Kapat</button>
    <button id="tour-next" class="primary" type="button" data-i18n="tour.next">İleri</button></div></div>
</div>
<script src="setup.js"></script>
<script src="wizard.js"></script>
<script src="settings.js"></script>
</body>
</html>
