<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Second Brain</title>
<meta name="sb-token" content="__TOKEN__">
<script src="/static/sbtoken.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Tek dosya (file:// ile de açılır) olduğu için belirteçler satır içi: sb/web/tokens.css değerleriyle aynı. */
:root{color-scheme:light dark;--bg:#fff;--surface:#f6f7f9;--surface-2:#eceef2;--raised:#fff;--border:#dfe2e8;--border-strong:#bcc2cd;--fg:#1a1b22;--muted:#565a69;--accent:#1556e4;--accent-2:#7c3aed;--on-accent:#fff;--danger:#b91c1c;--code-bg:#eef0f4;--sel:#bfd4ff;--sel-fg:#0b1530;--ring:rgba(21,86,228,.28);--sh:0 1px 2px rgba(20,22,30,.07),0 1px 1px rgba(20,22,30,.04);--r1:6px;--r2:10px;--r3:14px;--d1:120ms;--d2:200ms;--ease:cubic-bezier(.2,.7,.2,1);--mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#121317;--surface:#1a1c22;--surface-2:#23262e;--raised:#1f2128;--border:#2b2e38;--border-strong:#41454f;--fg:#e8e9ee;--muted:#a0a4b6;--accent:#7aa7ff;--accent-2:#a78bfa;--on-accent:#0b0d1a;--danger:#f87171;--code-bg:#262932;--sel:#2f4a85;--sel-fg:#fff;--ring:rgba(122,167,255,.34);--sh:0 1px 2px rgba(0,0,0,.45),0 1px 1px rgba(0,0,0,.3)}}
@media (prefers-contrast:more){:root{--border:#6b7180;--border-strong:#3d4250;--muted:#2f3340}}
@media (prefers-contrast:more) and (prefers-color-scheme:dark){:root{--border:#8b90a0;--border-strong:#b3b7c4;--muted:#d0d3de}}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
::selection{background:var(--sel);color:var(--sel-fg)}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:14px/1.55 system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.m{padding:9px 12px;border-radius:var(--r3);max-width:92%;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--border);align-self:flex-start;animation:rise var(--d2) var(--ease)}
.m.u{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--on-accent);border-bottom-right-radius:var(--r1);box-shadow:var(--sh)}
.m.e{color:var(--danger);border-color:var(--danger);background:transparent}
.m.wait{color:var(--muted);animation:pulse 1.2s ease-in-out infinite}
.m code{font-family:var(--mono);font-size:.9em;background:var(--code-bg);padding:0 5px;border-radius:var(--r1)}
.m.u code{background:rgba(255,255,255,.2)}
.src{font-size:12px;color:var(--muted);margin-top:8px;padding-top:6px;border-top:1px solid var(--border)}
form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--border);background:var(--surface)}
textarea{flex:1;resize:none;border-radius:var(--r2);border:1px solid var(--border-strong);padding:7px 9px;background:var(--bg);color:var(--fg);font:inherit;transition:border-color var(--d1),box-shadow var(--d1)}
textarea::placeholder{color:var(--muted)}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
button{border:0;border-radius:var(--r2);padding:0 14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);cursor:pointer;font:inherit;font-weight:600;box-shadow:var(--sh);transition:filter var(--d1),transform var(--d1) var(--ease)}
button:hover{filter:brightness(1.08)}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#mic{background:var(--surface-2);color:var(--fg);box-shadow:none;border:1px solid var(--border-strong)}
button.rec,#mic.rec{background:var(--danger);color:var(--on-accent);border-color:transparent}
button:disabled{opacity:.5;cursor:not-allowed}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
@media (forced-colors:active){.m,button,textarea{border:1px solid CanvasText}}
</style>
</head>
<body>
<div id="log"></div>
<form id="f">
  <textarea id="q" rows="2" placeholder="Beyne sor…"></textarea>
  <button type="button" id="mic" title="Sesle sor">Mik</button>
  <button type="submit" id="go">Gönder</button>
</form>
<script>
(function () {
  'use strict';
  var BASE = 'http://127.0.0.1:8765';
  var sid = 'bub' + Math.random().toString(36).slice(2, 12);
  var log = document.getElementById('log'), q = document.getElementById('q'), go = document.getElementById('go'), mic = document.getElementById('mic');

  function text(parent, s) {
    String(s == null ? '' : s).split('\n').forEach(function (ln, i) {
      if (i) parent.appendChild(document.createElement('br'));
      var re = /\*\*([^*\n]+)\*\*|`([^`\n]+)`/g, last = 0, m;
      while ((m = re.exec(ln))) {
        if (m.index > last) parent.appendChild(document.createTextNode(ln.slice(last, m.index)));
        var e = document.createElement(m[1] != null ? 'strong' : 'code'); e.textContent = m[1] != null ? m[1] : m[2]; parent.appendChild(e);
        last = re.lastIndex;
      }
      if (last < ln.length) parent.appendChild(document.createTextNode(ln.slice(last)));
    });
  }
  function add(cls, s) {
    var d = document.createElement('div'); d.className = 'm ' + (cls || ''); text(d, s); log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
  }
  async function api(path, init) {
    init = init || {}; init.headers = Object.assign({ 'X-SB': '1' }, init.headers || {});
    try {
      var r = await fetch(BASE + path, init), j = await r.json();
      if (!r.ok && !(j && j.error)) return { error: 'HTTP ' + r.status };
      return j;
    } catch (e) { return { error: 'Sunucuya ulaşılamadı. Asistan çalışıyor mu? (127.0.0.1:8765)' }; }
  }
  async function ask(t) {
    add('u', t);
    var w = add('wait', '…'); go.disabled = true;
    var r = await api('/api/v2/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sid: sid, text: t }) });
    go.disabled = false; w.textContent = ''; w.className = 'm';
    if (!r || r.error) { w.className = 'm e'; text(w, r && r.error || 'Hata'); return; }
    text(w, r.reply && r.reply.text || '(boş cevap)');
    var s = r.reply && r.reply.sources;
    if (s && s.length) {
      var b = document.createElement('div'); b.className = 'src';
      s.slice(0, 5).forEach(function (x) { var l = document.createElement('div'); l.textContent = '• ' + (x.title || x.path || x.kind); b.appendChild(l); });
      w.appendChild(b);
    }
    log.scrollTop = log.scrollHeight;
  }
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault(); var t = q.value.trim(); if (!t) return; q.value = ''; ask(t);
  });
  q.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('f').requestSubmit(); } });

  var rec = null, chunks = [];
  mic.addEventListener('click', async function () {
    if (rec) { rec.stop(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) { add('e', 'Bu pencerede ses kaydı desteklenmiyor.'); return; }
    try {
      var st = await navigator.mediaDevices.getUserMedia({ audio: true });
      rec = new MediaRecorder(st); chunks = [];
      rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
      rec.onstop = async function () {
        st.getTracks().forEach(function (t) { t.stop(); });
        var type = rec.mimeType || 'audio/webm'; rec = null; mic.classList.remove('rec'); mic.textContent = 'Mik';
        var r = await api('/api/v2/stt', { method: 'POST', headers: { 'Content-Type': type }, body: new Blob(chunks, { type: type }) });
        if (!r || r.error) add('e', r && r.error || 'Dökümde hata');
        else if (r.available === false) add('e', 'Ses tanıma kurulu değil: ' + (r.hint || ''));
        else if (r.text) q.value = (q.value ? q.value + ' ' : '') + r.text;
      };
      rec.start(); mic.classList.add('rec'); mic.textContent = 'Dur';
    } catch (e) { rec = null; add('e', 'Mikrofona erişilemedi.'); }
  });
  add('', 'Merhaba, ne öğrenmek istersin?');
})();
</script>
</body>
</html>
