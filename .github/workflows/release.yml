# v* etiketi atılınca Windows ve macOS'ta Second Brain Setup + Second Brain uygulamasını PyInstaller ile derler, GitHub Release'e ekler.
# Kit deposunda .github/workflows/release.yml olarak durur (tools/build_kit.py kopyalar). Etiket: git tag v1.0.0 && git push origin v1.0.0
# Release dosyaları: Second-Brain-Setup.exe (Windows), Second-Brain-Setup-macOS.zip (içinde Second Brain Setup.app) ve SHA256SUMS
# (iki dosyanın SHA-256 özeti; kit/install.ps1 ve install.sh indirdiği Setup dosyasını bununla doğrular).
# Güvenlik (denetim D-13): derleme kilit dosyasından (uv.lock, karma ile) kurar; `uses:` satırları tam commit SHA'sına sabit (yanında etiket);
# derleme işi yalnız OKUR, yayın izni (contents: write) yalnız etiketle çalışan ayrı `publish` işindedir.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:                       # elle çalıştırma yalnız derler (yayınlamaz)

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8                    # Windows konsolu cp1252: Türkçe çıktı derlemeyi düşürüyordu
  PYTHONUTF8: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Derleme bağımlılıkları (kilit dosyasından, karma doğrulamalı)
        shell: bash
        run: |
          uv export --frozen --no-emit-project --no-dev --group build --project system -o "$RUNNER_TEMP/build-lock.txt"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/build-lock.txt"
      - name: Second Brain ve Second Brain Setup derle
        shell: bash
        run: python packaging/build.py --kit .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: second-brain-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-files
          merge-multiple: true
      - name: SHA256SUMS üret (Setup.exe ve macOS zip için)
        shell: bash
        run: |
          cd release-files
          ls -l
          test -f Second-Brain-Setup.exe && test -f Second-Brain-Setup-macOS.zip
          sha256sum Second-Brain-Setup.exe Second-Brain-Setup-macOS.zip > SHA256SUMS
          cat SHA256SUMS
      - name: GitHub Release'e ekle
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
